name: Publish container release and DEV posts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Define release identity
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
          REVISION: ${{ github.sha }}
        run: |
          {
            echo "tag=$RELEASE_TAG"
            echo "image=ghcr.io/${REPOSITORY,,}"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE: ${{ steps.release.outputs.image }}
          REVISION: ${{ steps.release.outputs.revision }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF_NOTES
          Container image: \`$IMAGE:$RELEASE_TAG\`

          [View package](https://github.com/$GH_REPO/pkgs/container/${IMAGE##*/})

          Pull and run this exact image:

          \`\`\`sh
          docker pull $IMAGE@$DIGEST
          docker run --rm -p 8080:80 $IMAGE@$DIGEST
          \`\`\`

          Source commit: $REVISION

          [Workflow run]($RUN_URL)
          EOF_NOTES
          gh release create "$RELEASE_TAG" --target "$REVISION" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest=false

  publish-dev:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: devto
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEVTO_DIR: ./devto
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Convert Zola posts for DEV
        env:
          BASE_REF: ${{ github.event.before }}
        run: python3 scripts/zola_to_devto.py content/blog "$DEVTO_DIR" --base-ref "$BASE_REF"

      - name: Publish to DEV
        if: hashFiles(format('{0}/**/*.md', env.DEVTO_DIR)) != ''
        uses: sinedied/publish-devto@v2
        with:
          devto_key: ${{ secrets.DEVTO_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          files: ${{ env.DEVTO_DIR }}/**/*.md
